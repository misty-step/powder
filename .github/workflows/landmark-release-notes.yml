name: Landmark Release Notes

# Powder already publishes GitHub Releases from tag-push (release.yml).
# Landmark runs synthesis-only after that producer, matching .landmark.yml.
# Does not commit back to master (branch protection would drop a silent push).
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag to synthesize (e.g. v0.1.0).
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: landmark-${{ github.event.release.tag_name || inputs.release-tag }}
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Landmark
        uses: misty-step/landmark@v0
        with:
          mode: synthesis-only
          healthcheck: "true"
          release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
          github-token: ${{ github.token }}
          llm-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          changelog-source: auto
          product-description: "Powder is the self-hosted work ledger for agent fleets — one live pool, expiring claims, and a full audit trail."

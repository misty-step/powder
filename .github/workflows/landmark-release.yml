name: Landmark Release

on:
  workflow_run:
    workflows:
      - Go CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: landmark-release-${{ github.repository }}-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Skip if default branch has advanced
        id: bound
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)"
          if [ "${head}" != "${TESTED_SHA}" ]; then
            echo "stale=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping stale Landmark run tested=${TESTED_SHA} origin/${DEFAULT_BRANCH}=${head}"
          else
            echo "stale=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Run Landmark
        if: steps.bound.outputs.stale != 'true'
        uses: misty-step/landmark@d3b07452500e6cdf3ddead1c11ba5584287a80c9
        with:
          mode: full
          github-token: ${{ github.token }}
          node-version: "24"
          synthesis: "false"

name: Landmark Release

on:
  workflow_run:
    workflows:
      - Go CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: landmark-release-${{ github.repository }}-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: |
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify manual dispatch deployed this revision
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          run_id="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=${DEFAULT_BRANCH}&head_sha=${TESTED_SHA}&status=success&event=push&per_page=1" \
              --jq '.workflow_runs[0].id // empty'
          )"
          if [ -z "${run_id}" ]; then
            echo "::error::No successful Go CI deployment found for ${TESTED_SHA}"
            exit 1
          fi
          echo "::notice::Manual release is bound to successful Go CI run ${run_id}"
      - name: Skip if default branch has advanced
        id: bound
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)"
          if [ "${head}" != "${TESTED_SHA}" ]; then
            echo "stale=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping stale Landmark run tested=${TESTED_SHA} origin/${DEFAULT_BRANCH}=${head}"
          else
            echo "stale=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Run Landmark
        if: steps.bound.outputs.stale != 'true'
        uses: misty-step/landmark@d3b07452500e6cdf3ddead1c11ba5584287a80c9
        with:
          mode: full
          github-token: ${{ github.token }}
          node-version: "24"
          synthesis: "false"
      - name: Reconcile version tags with GitHub Releases
        if: always() && steps.bound.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          mapfile -t tags < <(
            git tag --list |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V
          )
          if [ "${#tags[@]}" -eq 0 ]; then
            exit 0
          fi

          highest="${tags[${#tags[@]} - 1]}"
          previous=""
          error_log="$(mktemp)"
          trap 'rm -f "${error_log}"' EXIT

          for tag in "${tags[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              > /dev/null 2>"${error_log}"; then
              previous="${tag}"
              continue
            fi
            if ! grep -q '(HTTP 404)' "${error_log}"; then
              cat "${error_log}" >&2
              exit 1
            fi

            echo "::warning::Recovering GitHub Release missing for ${tag}"
            args=(release create "${tag}" --verify-tag --generate-notes --title "${tag}")
            if [ "${tag}" != "${highest}" ]; then
              args+=(--latest=false)
            fi
            if [ -n "${previous}" ]; then
              args+=(--notes-start-tag "${previous}")
            fi
            gh "${args[@]}"
            previous="${tag}"
          done
